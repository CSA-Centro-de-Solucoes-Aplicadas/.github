name: "Tarefa"
description: "Trabalho técnico sem mudança de comportamento: chore, refactor, dívida técnica"
title: "[TAREFA] "
labels: []
body:
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: "O que precisa ser feito e por quê."
    validations:
      required: true

  - type: textarea
    id: escopo
    attributes:
      label: Escopo
      description: "O que entra e o que fica de fora."
      placeholder: |
        - [ ] Item 1
        - [ ] Item 2
    validations:
      required: false

  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      options:
        - chore
        - refactor
        - docs
        - test
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional
    validations:
      required: false
